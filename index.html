<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Platformer Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 10px;
        }

        .score-display {
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .level-display {
            color: #00ff88;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        canvas {
            border: 4px solid #4a5568;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }

        .jump-btn {
            width: 100px;
            height: 100px;
            background: rgba(255,107,107,0.3);
            border-color: rgba(255,107,107,0.5);
        }

        .jump-btn:active {
            background: rgba(255,107,107,0.5);
        }

        .instructions {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
        }

        .mobile-controls {
            display: none;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
                gap: 30px;
                margin-top: 15px;
            }

            canvas {
                width: 95vw;
                height: 60vh;
                max-width: 500px;
            }

            .control-btn {
                width: 70px;
                height: 70px;
            }

            .jump-btn {
                width: 90px;
                height: 90px;
            }

            .desktop-instructions {
                display: none;
            }
        }

        @media (min-width: 769px) {
            .desktop-instructions {
                display: block;
            }
        }

        .game-over-overlay, .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            border-radius: 12px;
            z-index: 10;
        }

        .overlay-title {
            font-size: 3rem;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        .win-overlay .overlay-title {
            color: #00ff88;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        .progress-bar {
            width: 100%;
            max-width: 800px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-display">⭐ <span id="score">0</span></div>
            <div class="level-display">Level <span id="level">1</span></div>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="overlay-title">GAME OVER</div>
                <div style="color: white; font-size: 1.2rem;">Score: <span id="finalScore">0</span></div>
                <button class="restart-btn" onclick="restartGame()">Try Again</button>
            </div>
            <div class="win-overlay" id="winOverlay">
                <div class="overlay-title">YOU WIN!</div>
                <div style="color: white; font-size: 1.2rem;">Score: <span id="winScore">0</span></div>
                <button class="restart-btn" onclick="nextLevel()">Next Level</button>
            </div>
        </div>

        <div class="mobile-controls">
            <div style="display: flex; gap: 15px;">
                <button class="control-btn" id="leftBtn">◀</button>
                <button class="control-btn" id="rightBtn">▶</button>
            </div>
            <button class="control-btn jump-btn" id="jumpBtn">⬆</button>
        </div>

        <div class="desktop-instructions">
            <div class="instructions">
                <strong>Controls:</strong> Arrow Keys or WASD to move • Space or W to jump
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        const isMobile = window.innerWidth <= 768;
        canvas.width = isMobile ? 500 : 800;
        canvas.height = isMobile ? 400 : 500;

        // Game state
        let score = 0;
        let currentLevel = 1;
        let gameOver = false;
        let gameWon = false;

        // Player properties
        const player = {
            x: 50,
            y: 300,
            width: 40,
            height: 50,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 15,
            gravity: 0.6,
            grounded: false,
            facingRight: true,
            animFrame: 0,
            animTimer: 0,
            color: '#FF6B6B'
        };

        // Input state
        const keys = {
            left: false,
            right: false,
            jump: false
        };

        // Level data
        const levels = [
            {
                platforms: [
                    { x: 0, y: 450, width: 800, height: 50, color: '#4A5568' },
                    { x: 150, y: 350, width: 120, height: 20, color: '#68D391' },
                    { x: 350, y: 280, width: 120, height: 20, color: '#68D391' },
                    { x: 550, y: 200, width: 120, height: 20, color: '#68D391' },
                    { x: 680, y: 120, width: 100, height: 20, color: '#FFD700' }
                ],
                coins: [
                    { x: 200, y: 310, collected: false },
                    { x: 400, y: 240, collected: false },
                    { x: 600, y: 160, collected: false },
                    { x: 720, y: 80, collected: false }
                ],
                goal: { x: 700, y: 80, width: 40, height: 40 },
                startPos: { x: 50, y: 350 }
            },
            {
                platforms: [
                    { x: 0, y: 450, width: 800, height: 50, color: '#4A5568' },
                    { x: 100, y: 380, width: 80, height: 20, color: '#68D391' },
                    { x: 250, y: 320, width: 80, height: 20, color: '#68D391' },
                    { x: 400, y: 260, width: 80, height: 20, color: '#68D391' },
                    { x: 250, y: 200, width: 80, height: 20, color: '#68D391' },
                    { x: 100, y: 140, width: 80, height: 20, color: '#68D391' },
                    { x: 300, y: 100, width: 100, height: 20, color: '#FFD700' },
                    { x: 550, y: 150, width: 80, height: 20, color: '#68D391' },
                    { x: 680, y: 200, width: 100, height: 20, color: '#FFD700' }
                ],
                coins: [
                    { x: 130, y: 340, collected: false },
                    { x: 280, y: 280, collected: false },
                    { x: 430, y: 220, collected: false },
                    { x: 280, y: 160, collected: false },
                    { x: 130, y: 100, collected: false },
                    { x: 340, y: 60, collected: false },
                    { x: 580, y: 110, collected: false }
                ],
                goal: { x: 710, y: 160, width: 40, height: 40 },
                startPos: { x: 50, y: 350 }
            },
            {
                platforms: [
                    { x: 0, y: 450, width: 150, height: 50, color: '#4A5568' },
                    { x: 200, y: 400, width: 60, height: 20, color: '#68D391' },
                    { x: 300, y: 350, width: 60, height: 20, color: '#68D391' },
                    { x: 200, y: 280, width: 60, height: 20, color: '#68D391' },
                    { x: 350, y: 220, width: 80, height: 20, color: '#68D391' },
                    { x: 500, y: 280, width: 60, height: 20, color: '#68D391' },
                    { x: 600, y: 350, width: 60, height: 20, color: '#68D391' },
                    { x: 700, y: 280, width: 60, height: 20, color: '#68D391' },
                    { x: 500, y: 150, width: 100, height: 20, color: '#FFD700' },
                    { x: 700, y: 150, width: 80, height: 20, color: '#FFD700' }
                ],
                coins: [
                    { x: 220, y: 360, collected: false },
                    { x: 320, y: 310, collected: false },
                    { x: 220, y: 240, collected: false },
                    { x: 380, y: 180, collected: false },
                    { x: 520, y: 240, collected: false },
                    { x: 620, y: 310, collected: false },
                    { x: 720, y: 240, collected: false },
                    { x: 540, y: 110, collected: false }
                ],
                goal: { x: 730, y: 110, width: 40, height: 40 },
                startPos: { x: 50, y: 350 }
            }
        ];

        let currentLevelData = null;

        // Initialize level
        function initLevel(levelNum) {
            const levelIndex = (levelNum - 1) % levels.length;
            currentLevelData = JSON.parse(JSON.stringify(levels[levelIndex]));
            player.x = currentLevelData.startPos.x;
            player.y = currentLevelData.startPos.y;
            player.velocityX = 0;
            player.velocityY = 0;
            player.grounded = false;
            gameOver = false;
            gameWon = false;
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('winOverlay').style.display = 'none';
            document.getElementById('level').textContent = levelNum;
            updateProgress();
        }

        // Update progress bar
        function updateProgress() {
            const collectedCoins = currentLevelData.coins.filter(c => c.collected).length;
            const totalCoins = currentLevelData.coins.length;
            const percentage = (collectedCoins / totalCoins) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                keys.jump = true;
                e.preventDefault();
            }
        });

document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
        });

        // Touch controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        function handleTouchStart(key, btn) {
            return (e) => {
                e.preventDefault();
                keys[key] = true;
                btn.style.background = 'rgba(255,255,255,0.3)';
            };
        }

        function handleTouchEnd(key, btn) {
            return (e) => {
                e.preventDefault();
                keys[key] = false;
                btn.style.background = 'rgba(255,255,255,0.15)';
            };
        }

        leftBtn.addEventListener('touchstart', handleTouchStart('left', leftBtn));
        leftBtn.addEventListener('touchend', handleTouchEnd('left', leftBtn));
        leftBtn.addEventListener('mousedown', handleTouchStart('left', leftBtn));
        leftBtn.addEventListener('mouseup', handleTouchEnd('left', leftBtn));
        leftBtn.addEventListener('mouseleave', handleTouchEnd('left', leftBtn));

        rightBtn.addEventListener('touchstart', handleTouchStart('right', rightBtn));
        rightBtn.addEventListener('touchend', handleTouchEnd('right', rightBtn));
        rightBtn.addEventListener('mousedown', handleTouchStart('right', rightBtn));
        rightBtn.addEventListener('mouseup', handleTouchEnd('right', rightBtn));
        rightBtn.addEventListener('mouseleave', handleTouchEnd('right', rightBtn));

        jumpBtn.addEventListener('touchstart', handleTouchStart('jump', jumpBtn));
        jumpBtn.addEventListener('touchend', handleTouchEnd('jump', jumpBtn));
        jumpBtn.addEventListener('mousedown', handleTouchStart('jump', jumpBtn));
        jumpBtn.addEventListener('mouseup', handleTouchEnd('jump', jumpBtn));
        jumpBtn.addEventListener('mouseleave', handleTouchEnd('jump', jumpBtn));

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Update game
        function update() {
            if (gameOver || gameWon) return;

            // Horizontal movement
            if (keys.left) {
                player.velocityX = -player.speed;
                player.facingRight = false;
            } else if (keys.right) {
                player.velocityX = player.speed;
                player.facingRight = true;
            } else {
                player.velocityX *= 0.8;
            }

            // Jumping
            if (keys.jump && player.grounded) {
                player.velocityY = -player.jumpPower;
                player.grounded = false;
            }

            // Apply gravity
            player.velocityY += player.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Platform collision
            player.grounded = false;
            for (let platform of currentLevelData.platforms) {
                if (checkCollision(player, platform)) {
                    // Landing on top
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= platform.y + 5) {
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.grounded = true;
                    }
                    // Hitting from bottom
                    else if (player.velocityY < 0 && player.y - player.velocityY >= platform.y + platform.height - 5) {
                        player.y = platform.y + platform.height;
                        player.velocityY = 0;
                    }
                    // Side collision
                    else {
                        if (player.velocityX > 0) {
                            player.x = platform.x - player.width;
                        } else if (player.velocityX < 0) {
                            player.x = platform.x + platform.width;
                        }
                        player.velocityX = 0;
                    }
                }
            }

            // Coin collection
            for (let coin of currentLevelData.coins) {
                if (!coin.collected) {
                    const coinRect = { x: coin.x - 12, y: coin.y - 12, width: 24, height: 24 };
                    if (checkCollision(player, coinRect)) {
                        coin.collected = true;
                        score += 10;
                        document.getElementById('score').textContent = score;
                        updateProgress();
                    }
                }
            }

            // Goal collision
            const goal = currentLevelData.goal;
            if (checkCollision(player, goal)) {
                gameWon = true;
                score += 50;
                document.getElementById('score').textContent = score;
                document.getElementById('winScore').textContent = score;
                document.getElementById('winOverlay').style.display = 'flex';
            }

            // Fall off screen
            if (player.y > canvas.height) {
                gameOver = true;
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOverOverlay').style.display = 'flex';
            }

            // Keep in bounds horizontally
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Animation
            player.animTimer++;
            if (player.animTimer > 8) {
                player.animTimer = 0;
                player.animFrame = (player.animFrame + 1) % 4;
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            drawCloud(100, 50, 40);
            drawCloud(300, 80, 35);
            drawCloud(550, 40, 45);
            drawCloud(700, 90, 30);

            // Draw platforms
            for (let platform of currentLevelData.platforms) {
                // Platform shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(platform.x + 4, platform.y + 4, platform.width, platform.height);

                // Platform body
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);

                // Platform highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(platform.x, platform.y, platform.width, 4);
            }

            // Draw coins
            for (let coin of currentLevelData.coins) {
                if (!coin.collected) {
                    drawCoin(coin.x, coin.y);
                }
            }

            // Draw goal
            const goal = currentLevelData.goal;
            drawFlag(goal.x, goal.y);

            // Draw player
            drawPlayer();
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size * 0.8, y - size * 0.2, size * 0.7, 0, Math.PI * 2);
            ctx.arc(x + size * 1.5, y, size * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCoin(x, y) {
            const bounce = Math.sin(Date.now() / 200) * 3;
            
            // Coin glow
            ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(x, y + bounce, 16, 0, Math.PI * 2);
            ctx.fill();

            // Coin body
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x, y + bounce, 12, 0, Math.PI * 2);
            ctx.fill();

            // Coin shine
            ctx.fillStyle = '#FFF8DC';
            ctx.beginPath();
            ctx.arc(x - 3, y + bounce - 3, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawFlag(x, y) {
            // Pole
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x + 15, y, 6, 40);

            // Flag
            ctx.fillStyle = '#00FF88';
            ctx.beginPath();
            ctx.moveTo(x + 21, y);
            ctx.lineTo(x + 45, y + 12);
            ctx.lineTo(x + 21, y + 24);
            ctx.closePath();
            ctx.fill();

            // Star on flag
            ctx.fillStyle = '#FFD700';
            ctx.font = '12px Arial';
            ctx.fillText('★', x + 25, y + 17);
        }

        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;

            // Player shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h + 3, w/2 - 2, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = player.color;
            ctx.fillRect(x + 5, y + 15, w - 10, h - 25);

            // Head
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(x + w/2, y + 12, 12, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#333';
            const eyeOffset = player.facingRight ? 3 : -3;
            ctx.beginPath();
            ctx.arc(x + w/2 + eyeOffset - 4, y + 10, 2, 0, Math.PI * 2);
            ctx.arc(x + w/2 + eyeOffset + 4, y + 10, 2, 0, Math.PI * 2);
            ctx.fill();

            // Legs animation
            const legOffset = Math.abs(player.velocityX) > 0.5 ? Math.sin(player.animFrame * Math.PI / 2) * 5 : 0;
            
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(x + 8, y + h - 12, 8, 12);
            ctx.fillRect(x + w - 16, y + h - 12, 8, 12);

            // Arms
            ctx.fillStyle = player.color;
            const armY = y + 20;
            ctx.fillRect(x, armY + legOffset, 6, 15);
            ctx.fillRect(x + w - 6, armY - legOffset, 6, 15);
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Restart game
        function restartGame() {
            score = 0;
            document.getElementById('score').textContent = 0;
            initLevel(currentLevel);
        }

        // Next level
        function nextLevel() {
            currentLevel++;
            initLevel(currentLevel);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            const isMobileNow = window.innerWidth <= 768;
            if (isMobileNow !== isMobile) {
                canvas.width = isMobileNow ? 500 : 800;
                canvas.height = isMobileNow ? 400 : 500;
                initLevel(currentLevel);
            }
        });

        // Start game
        initLevel(1);
        gameLoop();
    </script>
</body>
</html>
